# =============================================================================
# Automated Video Generator — docker-compose.yml
# =============================================================================
# Orchestrates the full stack:
#   speech     - Voicebox backend (Kokoro TTS + voice cloning)
#   app        - Node.js agentic pipeline (optional, for batch generation)
#
# Quick start:
#   docker compose up -d speech
#
# With model preloading:
#   VOICEBOX_PRELOAD=kokoro docker compose up -d speech
#
# First run will download ~300 MB of models (Kokoro-82M). Subsequent
# starts use the cached volume.
# =============================================================================

services:

  # ── Voicebox Speech Backend ────────────────────────────────────────────
  speech:
    build:
      context: .
      dockerfile: src/speech/Dockerfile
      args:
        # CPU-only (default). For CUDA 12.1:
        #   BASE_IMAGE: nvidia/cuda:12.1.0-runtime-ubuntu22.04
        #   TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
        BASE_IMAGE: python:3.11-slim
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    image: avs-voicebox:latest
    container_name: avs-speech
    restart: unless-stopped
    ports:
      - "17493:8000"
    volumes:
      # Persistent data: database, profiles, generated audio, model cache
      - voicebox-data:/data
      # Optional: mount a local cache to avoid re-downloading models
      # - ~/.cache/huggingface:/data/models/hub
    environment:
      - VOICEBOX_DATA_DIR=/data
      - VOICEBOX_MODELS_DIR=/data/models/hub
      - VOICEBOX_LOG_LEVEL=info
      - VOICEBOX_WORKERS=1
      - VOICEBOX_PRELOAD=${VOICEBOX_PRELOAD:-}
      # For GPU support, uncomment:
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    # Uncomment for GPU access:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Node.js Pipeline App ──────────────────────────────────────────────
  # Optional: run the agentic pipeline in a container
  # app:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.node
  #   image: avs-pipeline:latest
  #   container_name: avs-pipeline
  #   depends_on:
  #     speech:
  #       condition: service_healthy
  #   environment:
  #     - TTS_PROVIDER=voicebox
  #     - VOICEBOX_API_URL=http://speech:8000
  #     - VOICEBOX_PROFILE_ID=${VOICEBOX_PROFILE_ID}
  #   volumes:
  #     - pipeline-output:/app/output
  #   command: ["pipeline", "--file", "input/scripts/agentic-scripts.json"]

volumes:
  voicebox-data:
    driver: local
  pipeline-output:
    driver: local