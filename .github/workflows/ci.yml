name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Unit/Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Fails CI on lint ERRORS only (warnings are non-blocking). Covers
        # src/ and remotion/. The _study/ reference clones are gitignored +
        # ignored here.
        run: npx eslint src/ remotion/

      - name: Run test suite
        # Network-dependent image-provider tests (Wikimedia/MetMuseum) skip
        # automatically when their host is unreachable (see TESTING.md §6), so
        # CI does not require external network access or API keys.
        # Output is teed to a file and uploaded as an artifact (below) so a
        # Linux-runner-only failure is diagnosable from the downloaded log when
        # the in-page step log is not retained.
        run: npm run test:unit 2>&1 | tee test-suite.log

      - name: Upload test log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-log
          path: test-suite.log
          if-no-files-found: ignore

      - name: Coverage
        # Produces a coverage report (lines/functions/branches) and fails CI if
        # line coverage drops below a seeded floor (empirical-proof bar: a
        # production change must not silently erode coverage). The floor is set
        # just below the current ~82% so only genuine regressions turn CI red.
        run: MIN_LINE_COVERAGE=78 npm run test:coverage | node scripts/check-coverage.mjs

      - name: MCP doc freshness
        # Fails CI if docs/MCP_TOOL_REFERENCE.md is out of date with the
        # register-*.ts source files. Catches forgotten regenerations.
        run: npm run verify:mcp-doc
